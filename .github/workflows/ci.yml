# CI: unit tests, chart lint, image inventory, the security gates, and the live security
# tests on a throwaway kind cluster. Jobs call the same make targets as a local run, so CI
# and a laptop check the same things. Scanners are downloaded by make at pinned versions and
# checked against hashes in the repo, not run through third-party actions (ADR 0011).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default; no job writes to the repo, packages, PRs or code scanning.
# The SBOM goes out as a workflow artifact, which needs no extra permission.
permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions pinned by commit SHA: a tag can be moved to other code, a SHA can't.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false   # don't leave the token in .git/config for later steps
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"       # the runtime image's Python (app/Dockerfile)
          cache: pip
          cache-dependency-path: app/requirements*.txt
      # Wheels only, as in the image build: no package's setup.py runs.
      # Quoted: an unquoted ": " (as in ":all: ") would be parsed as a YAML mapping.
      - run: "python -m pip install --only-binary=:all: -r app/requirements-dev.txt"
      - run: python -m pytest -v
        working-directory: app

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # make downloads the pinned Helm and checks it against the hash in the Makefile.
      - run: make lint
      # Fails on an image without a digest or a digest its registry doesn't have; the diff
      # fails if a pin changed but the committed images.txt (Phase 8's mirror list) didn't.
      - run: make images
      - run: git diff --exit-code images.txt

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0               # full history: a secret deleted in a later commit still counts
      - run: make secrets-scan

  sast-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Bandit and pip-audit install from tools/scan-requirements.txt with --require-hashes.
      - run: make sast
      - run: make deps-audit

  iac-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: make scan-iac

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Builds the image and runs it read-only, non-root, with no capabilities.
      - run: make smoke
      # SBOM before the scan, and uploaded even if the scan fails: it's what you triage with.
      - run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error
      - run: make scan-image

  # Kyverno policies tested offline with the pinned Kyverno CLI: each policy against resources
  # it must admit, reject, mutate or generate for, exceptions included. No cluster needed.
  policy-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: make policy-test

  # Proves the gates above still reject bad input: a gate that silently stops failing would
  # otherwise look the same as a clean repo.
  gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: make test-gates

  # The controls proven on a live cluster on every PR: kind cluster, platform resources
  # (Kyverno and its policies included), Helm install as the deployer, then every
  # tests/security check.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: make up
      - run: make deploy
      - run: make test-security
      # Diagnostics only on failure; the runner, cluster included, is thrown away after.
      - if: failure()
        run: |
          eval "$(make -s kubeconfig)"
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
          kubectl get validatingpolicies,mutatingpolicies,generatingpolicies -o wide || true
          kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=100 || true
